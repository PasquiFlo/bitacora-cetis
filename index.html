let cur=talleres[0];
function save(){ localStorage.setItem("bitacora_buena", JSON.stringify(state)); }
function renderTabs(){ document.getElementById("tabs").innerHTML = talleres.map(function(t){ return '<div class="tab '+(t===cur?"active":"")+'" onclick="cambiarTaller(\''+t+'\')">'+t+'</div>'; }).join(""); }
function cambiarTaller(t){ cur=t; render(); }
function render(){
  renderTabs();
  let s = state[cur];
  let h = HORARIOS[cur] || [];
  let horarioHtml = h.length ? "<h3>Horario - "+cur+"</h3><table><tr><th>Día</th><th>Hora</th><th>Materia</th><th>Docente</th><th>Grupo</th></tr>"+h.map(function(x){ return "<tr><td>"+x.d+"</td><td>"+x.h+"</td><td>"+x.m+"</td><td>"+x.doc+"</td><td>"+x.g+"</td></tr>"; }).join("")+"</table>" : "<p><small>"+(cur==="Programación 3" ? "Taller en mantenimiento, sin horario por ahora." : "Sin horario asignado.")+"</small></p>";

  let logs = [];
  talleres.forEach(function(t){ (state[t].log||[]).forEach(function(l){ logs.push("<tr><td>"+l.fecha+"</td><td>"+t+"</td><td>"+l.entrada+"</td><td>"+(l.salida||"-")+"</td><td>"+l.m+"</td><td>"+l.doc+"</td><td>"+l.g+"</td></tr>"); }); });

function setPC(id, st){
  if(state[cur].m[id]==="Mantenimiento" && st==="Ocupado"){ alert("No se puede ocupar, está en mantenimiento."); return; }
  if(st==="Ocupado"){ let h=(HORARIOS[cur]||[])[0]; if(h && !confirm("Hoy toca: "+h.m+" - "+h.doc+" - Grupo "+h.g+" - "+h.h+"\n¿Sí, es esta clase?")){ return; } }
  state[cur].m[id]=st; save(); tursoGuardar(); render();
}
function ocuparTodas(){
  if(!confirm("¿Ocupar todas las PCs libres de "+cur+"? Las de mantenimiento NO se tocan.")) return;
  for(let i=1;i<=state[cur].pcs;i++){ let id="PC-"+String(i).padStart(2,"0"); if(state[cur].m[id]!=="Mantenimiento") state[cur].m[id]="Ocupado"; }
  save(); tursoGuardar(); render();
}
function liberarTodas(){
  for(let i=1;i<=state[cur].pcs;i++){ let id="PC-"+String(i).padStart(2,"0"); if(state[cur].m[id]!=="Mantenimiento") state[cur].m[id]="Libre"; }
  save(); tursoGuardar(); render();
}
function termino(){
  if(!confirm("¿Término de clase? Se liberan todas menos las de mantenimiento y se registra la salida del docente.")) return;
  liberarTodas();
  let logs = state[cur].log||[];
  if(logs.length && !logs[logs.length-1].salida){ logs[logs.length-1].salida = new Date().toLocaleTimeString(); save(); tursoGuardar(); }
  alert("Término de clase registrado. PCs liberadas, menos las de mantenimiento.");
  render();
}
function falla(id){
  let f = prompt("¿Qué falla tiene "+id+"? Ej: teclado, ratón, monitor, CPU, no enciende");
  if(!f) return;
  state[cur].m[id]="Mantenimiento";
  if(!state[cur].fallas) state[cur].fallas={};
  state[cur].fallas[id]=f+" - "+new Date().toLocaleString();
  alert(id+" quedó en mantenimiento por: "+f);
  save(); tursoGuardar(); render();
}
function registrar(){
  let doc=document.getElementById("doc").value, m=document.getElementById("mat").value, g=document.getElementById("gru").value;
  if(!doc){ alert("Escribe el nombre del docente"); return; }
  state[cur].log.push({fecha:new Date().toLocaleDateString(), entrada:new Date().toLocaleTimeString(), salida:"", m:m, doc:doc, g:g});
  alert("Docente registrado: "+doc);
  save(); tursoGuardar(); render();
}
function setPCs(){
  let n=parseInt(document.getElementById("npc").value);
  if(!n) return;
  state[cur].pcs=n; save(); tursoGuardar(); render();
}
function reactivar(){
  if(!confirm("¿Reactivar Programación 3? Se liberan sus PCs.")) return;
  for(let i=1;i<=30;i++){ state["Programación 3"].m["PC-"+String(i).padStart(2,"0")]="Libre"; }
  save(); tursoGuardar(); render();
}
function exportar(){
  let blob=new Blob([JSON.stringify(state,null,2)],{type:"application/json"});
  let a=document.createElement("a"); a.href=URL.createObjectURL(blob); a.download="bitacora-respaldo-"+new Date().toISOString().slice(0,10)+".json"; a.click();
}
function importar(e){
  let f=e.target.files[0]; if(!f) return;
  let r=new FileReader();
  r.onload=function(){ try{ state=JSON.parse(r.result); save(); render(); alert("Respaldo importado."); }catch(err){ alert("Archivo no válido"); } };
  r.readAsText(f);
}
function archivar(){
  let anio=document.getElementById("anio").value||new Date().getFullYear();
  let arch=JSON.parse(localStorage.getItem("bitacora_archivo")||"{}");
  arch[anio]=JSON.parse(JSON.stringify(state));
  localStorage.setItem("bitacora_archivo", JSON.stringify(arch));
  document.getElementById("archivo").innerHTML="<p><b>Año "+anio+" archivado.</b> Años guardados: "+Object.keys(arch).join(", ")+"</p>";
  alert("Año "+anio+" archivado.");
}

let tursoActivo = !!(TURSO_URL && TURSO_TOKEN);
async function tursoQuery(sql, args){
  if(!tursoActivo) return null;
  try{
    let r = await fetch(TURSO_URL + "/v2/pipeline", {method:"POST", headers:{"Authorization":"Bearer "+TURSO_TOKEN, "Content-Type":"application/json"}, body: JSON.stringify({requests:[{type:"execute", stmt:{sql:sql, args:args||[]}}, {type:"close"}]})});
    let j = await r.json();
    if(!r.ok){ window._ultimoErrorTurso = "Turso respondió " + r.status + ": " + JSON.stringify(j).slice(0,200); }
    return j;
  }catch(e){ window._ultimoErrorTurso = "No se pudo conectar: " + e.message; return null; }
}
function extraerValorTurso(j){
  try{
    let res = j && j.results && j.results[0] && (j.results[0].response ? j.results[0].response.result : j.results[0].result);
    let rows = res ? res.rows || [] : [];
    if(!rows.length) return null;
    let celda = rows[0][0];
    if(celda && typeof celda === "object") return celda.value != null ? celda.value : celda.text;
    return celda;
  }catch(e){ return null; }
}
async function tursoGuardar(){
  if(!tursoActivo) return;
  await tursoQuery("CREATE TABLE IF NOT EXISTS records (collection TEXT, id TEXT, value TEXT, PRIMARY KEY (collection, id))");
  await tursoQuery("INSERT OR REPLACE INTO records (collection, id, value) VALUES ('bitacora','estado', ?)", [{type:"text", value: JSON.stringify(state)}]);
}
async function tursoCargar(){
  if(!tursoActivo) return false;
  let j = await tursoQuery("SELECT value FROM records WHERE collection='bitacora' AND id='estado'");
  try{
    let val = extraerValorTurso(j);
    if(val){ let remoto = JSON.parse(val); if(remoto && Object.keys(remoto).length>0){ state = remoto; localStorage.setItem("bitacora_buena", JSON.stringify(state)); render(); return true; } }
  }catch(e){ window._ultimoErrorTurso = "No se pudo leer lo guardado: " + e.message; }
  return false;
}
async function actualizarDesdeTurso(){
  let el = document.getElementById("estadoTurso");
  if(!tursoActivo){ if(el) el.textContent = "⚠️ Turso no está conectado todavía. Falta pegar URL y Token en el código."; alert("Turso no está conectado todavía. Falta pegar URL y Token en el código."); return; }
  if(el) el.textContent = "⏳ Actualizando desde Turso...";
  window._ultimoErrorTurso = "";
  let ok = await tursoCargar();
  if(ok){ if(el) el.textContent = "✅ Actualizado desde Turso - " + new Date().toLocaleTimeString(); alert("✅ Actualizado desde Turso"); }
  else { let msg = window._ultimoErrorTurso || "No había nada nuevo en Turso, se quedó lo que ya tenías."; if(el) el.textContent = "⚠️ " + msg; alert("⚠️ No se pudo actualizar:\n" + msg); }
}
function actualizarEstadoTurso(){
  let el = document.getElementById("estadoTurso");
  if(el) el.textContent = tursoActivo ? "✅ Conectado a Turso. Pulsa para traer lo último." : "⚠️ Turso no conectado. Pega URL y Token en el código.";
}
render();
actualizarEstadoTurso();
if(tursoActivo){ tursoCargar(); }
